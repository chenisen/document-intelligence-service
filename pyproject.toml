[project]
name = "document-intelligence-service"
version = "0.1.0"
description = "Interpreta documentos medicos e devolve dados estruturados com confianca e evidencia por campo"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic>=2.9",
    "aws-lambda-powertools>=3.0",
    "boto3>=1.35",
    "pypdfium2>=4.30",
    "pillow>=11",
    "pillow-heif>=0.18",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "jsonschema>=4.23",
    "boto3-stubs[bedrock-runtime,kendra,textract]>=1.35",
    "pyyaml>=6",
    "httpx>=0.27",
    "uvicorn>=0.32",
]
samples = ["reportlab>=4.2", "numpy>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/usecases",
    "src/adapters",
    "src/entrypoints",
    "src/functions",
    "src/evals",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# The golden set generator is a one-shot tool, not service code: it stays under real linting,
# but without style rules over its long literal tables.
[tool.ruff.lint.per-file-ignores]
"samples/*" = ["E501"]

[tool.ruff.format]
exclude = ["samples/*"]

[tool.mypy]
python_version = "3.12"
packages = ["core", "usecases", "adapters", "entrypoints", "functions", "evals"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# The core and the use cases are what gets reviewed: every function is annotated there.
[[tool.mypy.overrides]]
module = ["core.*", "usecases.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/core"]
